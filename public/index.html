<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prato Cheio</title>
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <header class="topo">
    <h1>Prato Cheio<small>doe o excedente, alimente quem precisa</small></h1>
    <div id="barra-usuario" class="escondido">
      <strong id="nome-usuario"></strong>
      <small id="papel-usuario"></small>
      <button id="botao-sair" class="secundario">Sair</button>
    </div>
  </header>

  <main class="container">
    <!-- ---------------------------------------------------------------- AUTH -->
    <section id="tela-auth">
      <div class="abas">
        <button id="aba-login" class="ativa">Entrar</button>
        <button id="aba-cadastro">Criar conta</button>
      </div>

      <div id="painel-login" class="cartao">
        <label for="login-email">E-mail</label>
        <input id="login-email" type="email" autocomplete="email">
        <label for="login-senha">Senha</label>
        <input id="login-senha" type="password" autocomplete="current-password">
        <button id="form-login">Entrar</button>
        <p class="linha" style="margin-top:.8rem">Primeira vez? Use a aba <strong>Criar conta</strong>.</p>
      </div>

      <div id="painel-cadastro" class="cartao escondido">
        <label for="cad-papel">Sou</label>
        <select id="cad-papel">
          <option value="restaurante">Restaurante (quero doar)</option>
          <option value="ong">ONG (quero receber)</option>
        </select>
        <label for="cad-nome">Nome do estabelecimento / instituição</label>
        <input id="cad-nome">
        <label for="cad-email">E-mail</label>
        <input id="cad-email" type="email" autocomplete="email">
        <label for="cad-senha">Senha (mínimo 6 caracteres)</label>
        <input id="cad-senha" type="password" autocomplete="new-password">
        <label for="cad-telefone">Telefone</label>
        <input id="cad-telefone" type="tel">
        <label for="cad-endereco">Endereço</label>
        <input id="cad-endereco">
        <button id="form-cadastro">Criar conta</button>
      </div>

      <p id="aviso-auth" class="aviso escondido"></p>
    </section>

    <!-- -------------------------------------------------------- RESTAURANTE -->
    <section id="tela-restaurante" class="escondido"></section>

    <!-- ---------------------------------------------------------------- ONG -->
    <section id="tela-ong" class="escondido"></section>

    <noscript>
      <div class="cartao">O Prato Cheio precisa de JavaScript ativado para funcionar.</div>
    </noscript>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
